<article class="card" [class.promo]="produto().promo">
    <img class="thumb" [src]="produto().imagemUrl"> <!-- coloca os [] pq a img vem do signal produto -->
    <div class="conteudo">
        <h3 class="titulo">{{ produto().nome }}</h3>
        <p class="desc">{{produto().descricao}}</p>
        <div class="linhapreco">
            <span class="preco">{{produto().preco | currency:'BRL' }}</span>
            <app-quantidade-controle [(contador)]="quantidade"></app-quantidade-controle> <!-- operador banana pq ele entra e sai tb -->
        </div>
        <div class="acoes">
            <button type="button" class="btn primary" (click)="onAdd()">Adicionar</button> <!-- botao para adicionar produto no carrinho, click é tipo onclick do js-->
            <button type="button" class="btn ghost" (click)="onView()">Detalhes</button>
        </div>
    </div>
</article>
