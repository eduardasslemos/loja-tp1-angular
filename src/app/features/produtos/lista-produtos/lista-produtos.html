    <header class="barradetarefas">
        <h2>Catálogo</h2>
        <button class="btn sopromo" [class.active]="apenasPromo()"
                                    (click)="alternarPromo()">
            @if(apenasPromo()){
                Mostrar todos
            }
            @else {
                Promoções
            }
        </button>
    </header>

    @if(produtosExibidos().length === 0){
        <p class="vazio">Nenhum produto encontrado para ser exibido.</p>
    }
    @else {
        <div class="grid">
            @for(prod of produtosExibidos(); track prod.id){
                <app-card-produto [produto]="prod" (view)="onViewProduct($event)" (add)="onAddProduct($event)"/>
            }
        </div>
    }
</section>
